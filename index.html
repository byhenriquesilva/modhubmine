<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Modrinth - Mods</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-cubes"></i>
                    <span>Meus Mods</span>
                </div>
                <div class="nav-actions">
                    <button id="downloadAllBtn" class="btn btn-primary">
                        <i class="fas fa-download"></i> Baixar Todos
                    </button>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Buscar mods..." />
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Descubra Mods Incríveis</h1>
            <p>Explore minha coleção de mods para Minecraft</p>
        </div>
    </section>

    <!-- Mods Grid -->
    <main class="container">
        <div class="mods-grid" id="modsGrid">
            <!-- Mods serão carregados via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Meus Mods - Todos os direitos reservados</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
